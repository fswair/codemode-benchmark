      id: top_level_none
      input: null
      raises: TypeError
      match: Expected list, got NoneType
  - case:
      id: top_level_integer
      input: 123
      raises: TypeError
      match: Expected list, got int
  - case:
      id: top_level_string
      input: abc
      raises: TypeError
      match: Expected list, got str
  - case:
      id: top_level_float
      input: 3.14
