eval_rpn:
  evals:
    ReturnType:
      type: "int"
    FastExecution:
      duration: 0.005
  dataset:
    - case:
        id: "addition_multiplication"
        input: ["2", "1", "+", "3", "*"]
        expected: 9
    - case:
        id: "division_truncation_positive"
        input: ["4", "13", "5", "/", "+"]
        expected: 6
    - case:
        id: "complex_nested_expression"
        input: ["10", "6", "9", "3", "+", "-11", "*", "/", "*", "17", "+", "5", "+"]
        expected: 22
    - case:
        id: "single_operand"
        input: ["5"]
        expected: 5
    - case:
        id: "negative_result_multiplication"
        input: ["-5", "2", "*"]
        expected: -10
    - case:
        id: "division_positive_round_zero"
        input: ["10", "3", "/"]
        expected: 3
    - case:
        id: "division_negative_num_round_zero"
        input: ["-10", "3", "/"]
        expected: -3
    - case:
        id: "division_negative_den_round_zero"
        input: ["10", "-3", "/"]
        expected: -3
    - case:
        id: "multiplication_two_negatives"
        input: ["-1", "-1", "*"]
        expected: 1
    - case:
        id: "zero_numerator"
        input: ["0", "5", "/"]
        expected: 0
    - case:
        id: "subtraction_negative_result"
        input: ["100", "200", "-"]
        expected: -100
    - case:
        id: "composition_nested_ops"
        input: ["1", "2", "+", "3", "4", "+", "*"]
        expected: 21
    - case:
        id: "sequential_ops"
        input: ["10", "2", "/", "5", "*"]
        expected: 25
    - case:
        id: "zero_operands"
        input: ["0", "0", "+"]
        expected: 0
    - case:
        id: "large_integer_result"
        input: ["1000000", "1000000", "*"]
        expected: 1000000000000
    - case:
        id: "large_negative_arithmetic"
        input: ["-123456789", "1", "+"]
        expected: -123456788
    - case:
        id: "subtraction_zero_minus_one"
        input: ["0", "1", "-"]
        expected: -1
    - case:
        id: "negative_one_division"
        input: ["-1", "1", "/"]
        expected: -1
    - case:
        id: "all_operators_chain"
        input: ["5", "5", "*", "5", "/", "5", "+", "5", "-"]
        expected: 5
    - case:
        id: "stack_accumulation"
        input: ["2", "3", "4", "*", "+"]
        expected: 14
    - case:
        id: "nested_truncation"
        input: ["10", "2", "/", "2", "/"]
        expected: 2
    - case:
        id: "division_two_negatives"
        input: ["-7", "-3", "/"]
        expected: 2
    - case:
        id: "addition_to_zero"
        input: ["1", "-1", "+"]
        expected: 0
    - case:
        id: "multiplication_by_zero"
        input: ["999", "0", "*"]
        expected: 0
    - case:
        id: "truncation_lower_bound"
        input: ["10", "7", "/"]
        expected: 1
    - case:
        id: "complex_truncation_negatives"
        input: ["-2", "3", "*", "-4", "/"]
        expected: 1
    - case:
        id: "error_empty_expression"
        input: []
        raises: "ValueError"
        match: "Empty expression"
    - case:
        id: "error_not_enough_operands_plus"
        input: ["1", "+"]
        raises: "ValueError"
        match: "Not enough operands for '\\+'"
    - case:
        id: "error_division_by_zero"
        input: ["1", "0", "/"]
        raises: "ZeroDivisionError"
        match: "Division by zero"
    - case:
        id: "error_invalid_token_string"
        input: ["1", "abc", "+"]
        raises: "ValueError"
        match: "Invalid token: 'abc'"
    - case:
        id: "error_stack_remaining_two"
        input: ["1", "2"]
        raises: "ValueError"
        match: "Invalid expression: 2 values remaining on stack"
    - case:
        id: "error_operator_only"
        input: ["+"]
        raises: "ValueError"
        match: "Not enough operands for '\\+'"
    - case:
        id: "error_stack_remaining_multiple"
        input: ["1", "2", "3", "-", "+", "4", "5"]
        raises: "ValueError"
        match: "Invalid expression: 3 values remaining on stack"
    - case:
        id: "error_invalid_token_float_string"
        input: ["1", "2.5", "+"]
        raises: "ValueError"
        match: "Invalid token: '2.5'"
    - case:
        id: "error_not_enough_operands_minus"
        input: ["1", "2", "*", "-"]
        raises: "ValueError"
        match: "Not enough operands for '-'"
    - case:
        id: "error_invalid_token_whitespace"
        input: [" ", " "]
        raises: "ValueError"
        match: "Invalid token: ' '"