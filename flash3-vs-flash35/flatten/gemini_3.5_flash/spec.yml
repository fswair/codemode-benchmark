flatten:
  evals:
    IsList:
      type: list
    NoNestedListsLeft:
      assertion: all(not isinstance(x, list) for x in output)
    FastEnough:
      duration: 0.05
  dataset:
  - case:
      id: flat_integers
      input:
      - 1
      - 2
      - 3
      expected:
      - 1
      - 2
      - 3
  - case:
      id: empty_list
      input: []
      expected: []
  - case:
      id: simple_nesting
      input:
      - - 1
        - 2
      - - 3
        - 4
      expected:
      - 1
      - 2
      - 3
      - 4
  - case:
      id: right_nested
      input:
      - 1
      - - 2
        - - 3
          - - 4
            - - 5
      expected:
      - 1
      - 2
      - 3
      - 4
      - 5
  - case:
      id: left_nested
      input:
      - - - - 1
          - 2
        - 3
      - 4
      expected:
      - 1
      - 2
      - 3
      - 4
  - case:
      id: flat_diverse_primitives
      input:
      - 1
      - a
      - 3.14
      - true
      - null
      expected:
      - 1
      - a
      - 3.14
      - true
      - null
  - case:
      id: nested_diverse_primitives
      input:
      - 1
      - - 2
        - a
      - - 3.14
        - - true
          - null
      expected:
      - 1
      - 2
      - a
      - 3.14
      - true
      - null
  - case:
      id: nested_empty_mixed
      input:
      - []
      - - []
      - - 1
        - []
      - - - []
      expected:
      - 1
  - case:
      id: deeply_nested_empty
      input:
      - - []
      expected: []
  - case:
      id: deeply_nested_one_element
      input:
      - - - 1
      expected:
      - 1
  - case:
      id: nesting_level_9
      input:
      - - - - - - - - - 1
      expected:
      - 1
  - case:
      id: nesting_level_50
      input:
      - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 50
      expected:
